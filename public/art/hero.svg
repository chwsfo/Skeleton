<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" role="img" aria-labelledby="t">
  <title id="t">Santa at the helm of a red-sailed ship, pulled across a moonlit sea by a whale, two walruses in Santa hats and two seals in scarves</title>
  <style>
    .ship { transform-box: view-box; transform-origin: 900px 340px; animation: rock 7s ease-in-out infinite; }
    .bob { animation: bob 3.4s ease-in-out infinite; }
    .bob2 { animation: bob 3.9s ease-in-out -1.3s infinite; }
    .bob3 { animation: bob 4.4s ease-in-out -2.1s infinite; }
    .drift { animation: drift 10s linear infinite; }
    .drift-slow { animation: drift 18s linear infinite; }
    .drift-fast { animation: drift 7s linear infinite; }
    .spout { transform-box: fill-box; transform-origin: 50% 100%; animation: spout 3.6s ease-in-out infinite; }
    .tw { animation: tw 3.2s ease-in-out infinite; }
    .tw:nth-of-type(3n) { animation-delay: -1.1s; animation-duration: 4.1s; }
    .tw:nth-of-type(3n+1) { animation-delay: -2.3s; animation-duration: 2.7s; }
    .flag { transform-box: fill-box; transform-origin: 100% 50%; animation: flutter 1.6s ease-in-out infinite; }
    .glow { animation: glow 2.8s ease-in-out infinite; }
    @keyframes rock { 0%, 100% { transform: rotate(-0.9deg) translateY(0); } 50% { transform: rotate(1.1deg) translateY(4px); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes drift { to { transform: translateX(-200px); } }
    @keyframes spout { 0%, 100% { transform: scale(0.7); opacity: 0.55; } 45% { transform: scale(1.06); opacity: 1; } }
    @keyframes tw { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
    @keyframes flutter { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(3deg) scaleX(0.94); } }
    @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081626"/>
      <stop offset="0.55" stop-color="#14324f"/>
      <stop offset="1" stop-color="#23507a"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#f6e7b8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f6e7b8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f6e7b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4d2b"/>
      <stop offset="1" stop-color="#3a2313"/>
    </linearGradient>
    <linearGradient id="redSail" x1="0" y1="0" x2="1" y2="0">
