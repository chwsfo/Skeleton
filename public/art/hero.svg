      <stop offset="1" stop-color="#d8c49a"/>
    </linearGradient>
    <linearGradient id="seaFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173d60"/>
      <stop offset="1" stop-color="#0e2a44"/>
