<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0c1f33" />
    <meta name="description" content="Your Secret Santa orders have washed ashore. Open them in private." />
    <!-- Link preview card. The image URL must be absolute: update it if the site is renamed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Jolly Kringle" />
    <meta property="og:title" content="Ahoy! A message in a bottle for you" />
    <meta property="og:description" content="Your Secret Santa orders have washed ashore. Open them in private." />
    <meta property="og:image" content="https://secretchrimbo.netlify.app/art/invite-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sea-worn, barnacled bottle tied with a red bow and holly, floating on a moonlit sea with a rolled-up message inside" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>The Jolly Kringle</title>
    <link rel="icon" href="art/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="art/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="snow" aria-hidden="true"></div>

    <header class="hero">
      <img
        class="hero-art"
        src="art/hero.svg"
        width="1200"
        height="460"
        alt="Santa at the helm of a red-sailed ship, pulled across a moonlit sea by a whale, two walruses in Santa hats and two seals in scarves, all in jingle-bell harnesses on a tow line"
      />
      <div class="masthead">
        <p class="kicker">Secret Santa on the high seas</p>
        <h1>The Jolly Kringle</h1>
        <p class="voyage" id="voyage">Christmas voyage</p>
      </div>
    </header>

    <main id="app">
      <p class="loading">Hoisting the sails…</p>
    </main>

    <footer>
      <p>Fair winds and following seas.</p>
      <p>Lost your link? Ask the organizer to send it again.</p>
    </footer>

    <noscript><p class="loading">This ship needs JavaScript to sail.</p></noscript>
    <script type="module" src="crew.js"></script>
  </body>
</html>
